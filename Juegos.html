<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Chewy&display=swap" rel="stylesheet">
    <title>Zona Gamer</title>

    <style>
        body {
            margin: 0;
            background: linear-gradient(#ff8fcf, #e7f3ff);
            color: #555;
        }

        /* ===== HEADER ===== */
        header {
            margin: 20px;
            padding: 15px 30px;
            background: #ffffffcc;
            border-radius: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.12);
        }

        header h1 {
            margin: 0;
            font-family:'Orbitron', fantasy;
            font-size: 32px;
            color: #9b6df0;
        }

        nav a {
            margin: 0 12px;
            text-decoration: none;
            color: #8aaacb;
            font-weight: bold;
        }

        .login {
            padding: 8px 20px;
            background: linear-gradient(#f8a6cf, #e88bc0);
            border-radius: 20px;
            color: white;
        }

        /* ===== HERO ===== */
        .hero {
            text-align: center;
            padding: 60px 20px;
            margin: 20px;
            background: linear-gradient(#ffcdf8, #fbfdff);
            border-radius: 30px;
        }

        .hero h2 {
            font-size: 29px;
            color: #ef75d3;
        }

        /* ===== SECCIÓN DE JUEGOS ===== */
        .seccion-juegos {
            padding: 50px 30px;
        }

        .seccion-juegos h2 {
            text-align: center;
            font-size: 30px;
            color: #8b6fe6;
            margin-bottom: 40px;
        }

        .juegos-burbujas {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 30px;
        }

        .juego-burbuja {
            background: #ffffffcc;
            border-radius: 30px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 12px 25px rgba(0,0,0,0.12);
        }

        .juego-burbuja img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-radius: 22px;
        }

        .juego-burbuja h3 {
            color: #d982c4;
            margin: 15px 0 10px;
        }

        .juego-burbuja p {
            font-size: 14px;
            line-height: 1.5;
        }

        .juego-burbuja button {
            margin-top: 12px;
            padding: 10px 22px;
            border: none;
            border-radius: 25px;
            background: linear-gradient(#7fd6d6, #5fc1c1);
            color: white;
            font-size: 14px;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .juego-burbuja button:hover {
            background: linear-gradient(#f8a6cf, #e88bc0);
        }

        .btn-fav {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            color: #bbb;
            transition: transform 0.3s, color 0.3s;
        }

        .btn-fav:hover {
            transform: scale(1.3);
        }

        .btn-fav.activo {
            color: #ff5acd;
        }

        /* ===== FILTROS Y BUSCADOR ===== */
        .filtros {
            text-align: center;
            margin: 40px 0;
        }

        .filtros button {
            background: linear-gradient(#ff8fcf, #9b6df0);
            color: white;
            border: none;
            padding: 12px 25px;
            margin: 8px;
            border-radius: 25px;
            font-family: 'Baloo 2', cursive;
            font-size: 15px;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .filtros button:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 20px rgba(0,0,0,.2);
        }

        .filtros button.activo {
            background: linear-gradient(#ff5acd, #ff9adf);
            box-shadow: 0 0 15px rgba(255,90,205,.8);
            transform: scale(1.15);
        }

        .buscador {
            text-align: center;
            margin: 30px 0;
        }

        .buscador input {
            width: 60%;
            max-width: 400px;
            padding: 12px 18px;
            border-radius: 25px;
            border: 2px solid #ff9adf;
            font-family: 'Baloo 2', cursive;
            font-size: 16px;
        }

        .buscador input:focus {
            outline: none;
            box-shadow: 0 0 15px #ffb6d9;
        }

        /* ===== FOOTER ===== */
        footer {
            margin-top: 40px;
            text-align: center;
            padding: 20px;
            background: #f3d7ef;
            color: #777;
        }

        /* ===== ANIMACIONES ===== */
        @keyframes aparecer {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes flotar {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-8px);
            }
        }

        header h1 {
            font-family: 'Chewy', cursive;
            font-size: 34px;
            color: #9b6df0;
            letter-spacing: 2px;
            animation: flotar 3s ease-in-out infinite;
        }

        .hero,
        .seccion-juegos,
        footer {
            animation: aparecer 1.2s ease;
        }

        .juego-burbuja {
            background: #ffffffcc;
            border-radius: 30px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 12px 25px rgba(5, 241, 56, 0.12);
            transition: transform 0.3s, box-shadow 0.3s;
            animation: aparecer 1.5s ease;
        }

        .juego-burbuja:hover {
            transform: translateY(-10px) scale(1.03);
            box-shadow: 0 18px 35px rgba(0,0,0,0.2);
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background: #fff;
            padding: 25px;
            border-radius: 25px;
            max-width: 850px;
            width: 90%;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
        }

        .modal-juegos {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
            overflow-y: auto;
            padding-right: 8px;
        }

        .modal-juego {
            text-align: center;
            background: #faf7ff;
            padding: 15px;
            border-radius: 20px;
        }

        .modal-juego img {
            width: 100%;
            height: 120px;
            object-fit: cover;
            border-radius: 15px;
        }

        .modal-juego button {
            margin-top: 8px;
            padding: 6px 15px;
            border: none;
            border-radius: 15px;
            background: #ff67c0;
            color: white;
            cursor: pointer;
        }

        .descripcion {
            font-size: 13px;
            margin-top: 8px;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease, opacity 0.4s ease;
            opacity: 0;
        }

        .descripcion.activa {
            max-height: 80px;
            opacity: 1;
        }

        .cerrar {
            margin-top: 15px;
            padding: 10px 25px;
            border: none;
            border-radius: 20px;
            background: #9b6df0;
            color: white;
            cursor: pointer;
        }
        .descargas{
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-top: 10px;
}

.btn-play:hover,

function abrirModal(tipo) {
    document.getElementById("modalTitulo").innerText = datos[tipo].titulo;
    const cont = document.getElementById("modalJuegos");
    cont.innerHTML = "";

    datos[tipo].juegos.forEach(j => {
        cont.innerHTML += `
            <div class="modal-juego">
                <img src="${j.i}">
                <h4>${j.n}</h4>
                <button onclick="toggleDesc(this)">Ver más</button>
                <p class="descripcion">${j.d}</p>

                <div class="descargas">
                    ${j.PlayStore ? `<a href="${j.PlayStore}" target="_blank" class="btn-play"> Play Store</a>` : ""}
                    ${j.AppStore ? `<a href="${j.AppStore}" target="_blank" class="btn-app"> App Store</a>` : ""}
                    ${j.PlayStation ? `<a href="${j.PlayStation}" target="_blank" class="btn-app"> PlayStation</a>` : ""}
                    ${j.XBOX ? `<a href="${j.XBOX}" target="_blank" class="btn-app"> XBOX</a>` : ""}
                    ${j.Nintendo ? `<a href="${j.Nintendo}" target="_blank" class="btn-app"> Nintendo</a>` : ""}
                </div>
            </div>`;
    });

    document.getElementById("modal").style.display = "flex";
}

function toggleDesc(btn) {
    const desc = btn.nextElementSibling;
    if (desc.classList.contains("activa")) {
        desc.classList.remove("activa");
        btn.innerText = "Ver más";
    } else {
        document.querySelectorAll(".descripcion").forEach(d => d.classList.remove("activa"));
        document.querySelectorAll(".modal-juego button").forEach(b => b.innerText = "Ver más");
        desc.classList.add("activa");
        btn.innerText = "Ver menos";
    }
}

function cerrarModal() {
    document.getElementById("modal").style.display = "none";
}

function filtrar(categoria) {
    const juegos = document.querySelectorAll(".juego-burbuja");
    juegos.forEach(juego => {
        if (categoria === "todos" || juego.dataset.categoria === categoria) {
            juego.style.display = "block";
        } else {
            juego.style.display = "none";
        }
    });

    // Marcar el botón activo
    document.querySelectorAll('.filtros button').forEach(btn => btn.classList.remove('activo'));
    document.querySelector(`.filtros button[onclick="filtrar('${categoria}')"]`).classList.add('activo');
}
</script>
