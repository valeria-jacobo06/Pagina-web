<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Chewy&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">

<title>Zona Gamer</title>

<style>
/* ================= BASE ================= */
body{
    margin:0;
    color:#555;
    font-family:'Baloo 2', cursive;
    overflow-x:hidden;
}

/* ================= FONDO ANIMADO ================= */
.background{
    position:fixed;
    inset:0;
    z-index:-10;
    overflow:hidden;
    pointer-events:none;
}

.layer{
    position:absolute;
    inset:0;
    background-repeat:repeat;
}

/* Fondo pastel */
.fondo{
    background: linear-gradient(135deg, #fce4ec, #e3f2fd);
    animation: moverFondo 60s linear infinite;
}

/* Nubes */
.nubes{
    background-image:url("data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNDAwIiBoZWlnaHQ9IjE1MCIgdmlld0JveD0iMCAwIDQwMCAxNTAiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PHBhdGggZmlsbD0iI2ZmZiIgZmlsbC1vcGFjaXR5PSIwLjciIGQ9Ik01MCAxMDBjLTI1IDAtNDAtMjAtMzAtMzUgMjUtNDAgNjAtMzAgNzUtMTAgMjUgMjUgMTUgNTUgNjAgNjAiLz48L3N2Zz4=");
    background-size:800px;
    opacity:.6;
    animation:moverNubes 120s linear infinite;
}

/* Estrellas */
.estrellas{
    background-image:url("data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iODAiIGhlaWdodD0iODAiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PGNpcmNsZSBjeD0iNDAiIGN5PSI0MCIgcj0iMiIgZmlsbD0iI2ZmZiIvPjwvc3ZnPg==");
    background-size:80px 80px;
    opacity:.4;
    animation:parpadeo 6s ease-in-out infinite alternate;
}

/* Brillo */
.brillo{
    background:radial-gradient(circle, rgba(255,255,255,.3), transparent 70%);
    animation:brillo 8s ease-in-out infinite;
}

/* Animaciones fondo */
@keyframes moverFondo{ from{transform:translateX(0)} to{transform:translateX(-50%)} }
@keyframes moverNubes{ from{transform:translateX(0)} to{transform:translateX(1000px)} }
@keyframes parpadeo{ from{opacity:.2} to{opacity:.6} }
@keyframes brillo{ 0%,100%{opacity:.2} 50%{opacity:.5} }

/* ================= CONTENIDO ================= */
header, section, footer, .modal{
    position:relative;
    z-index:5;
}

/* ================= ANIMACIONES UI ================= */
@keyframes aparecer{from{opacity:0;transform:translateY(30px)}to{opacity:1}}
@keyframes flotar{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes pulso{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}

/* ================= HEADER ================= */
header{
    margin:20px;
    padding:15px 30px;
    background:#ffffffcc;
    border-radius:20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 10px 25px rgba(0,0,0,.1);
}
header h1{
    font-family:'Chewy', cursive;
    color:#9b6df0;
    animation:flotar 3s infinite;
}
nav a{
    margin:0 15px;
    text-decoration:none;
    color:#8aaacb;
    font-weight:bold;
}
.login{
    padding:8px 20px;
    background:linear-gradient(#f8a6cf,#e88bc0);
    border-radius:18px;
    color:white;
}

/* ================= HERO ================= */
.hero{
    text-align:center;
    padding:60px 20px;
    background:#ffffffaa;
    border-radius:25px;
    margin:20px;
}
.hero h2{
    font-family:'Fredoka', sans-serif;
    font-size:40px;
    color:#ff5acd;
}

/* ================= FOOTER ================= */
footer{
    text-align:center;
    padding:20px;
    background:#f3d7ef;
}
</style>
</head>

<body>

<!-- ===== FONDO ANIMADO ===== -->
<div class="background">
  <div class="layer fondo"></div>
  <div class="layer nubes"></div>
  <div class="layer estrellas"></div>
  <div class="layer brillo"></div>
</div>

<header>
  <h1>Zona Gamer</h1>
  <nav>
    <a href="#">Inicio</a>
    <a href="#">Juegos</a>
    <a href="#">Foro</a>
    <a class="login" href="#">Iniciar Sesión</a>
  </nav>
</header>

<section class="hero">
  <h2>Explora un mundo lleno de videojuegos 🎮</h2>
</section>

<footer>
  © 2025 Zona Gamer
</footer>

<!-- ===== PARALLAX ===== -->
<script>
window.addEventListener("scroll", ()=>{
  const y = window.scrollY;
  document.querySelector(".fondo").style.transform = `translateX(${-y*0.1}px)`;
  document.querySelector(".nubes").style.transform = `translateX(${y*0.2}px)`;
});
</script>

</body>
</html>
